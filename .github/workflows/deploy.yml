name: NovaPay CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python application
        run: |
          python -m py_compile app.py

      - name: Build Docker image
        run: |
          docker build -t novapay-app .

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::181040157383:role/NovaPayGitHubActionsRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy NovaPay to Server 1
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c354140bcd68f6b8" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "cd /opt/novapay",
              "git fetch origin",
              "git reset --hard origin/main",
              "docker build -t novapay-app:latest .",
              "docker rm -f novapay-production || true",
              "docker run -d --name novapay-production --restart unless-stopped --env-file /etc/novapay.env -p 8080:8080 novapay-app:latest",
              "sleep 5",
              "curl --fail http://localhost:8080/health"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0c354140bcd68f6b8"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0c354140bcd68f6b8" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
